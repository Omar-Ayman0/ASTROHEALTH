name: tests
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-tested-py313.txt
      - run: python tests/test_engine.py
      - run: python tests/test_live.py

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-tested-py313.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: integration/node
        run: npm test
